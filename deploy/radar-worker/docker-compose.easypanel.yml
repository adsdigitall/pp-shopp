services:
  radar-worker:
    build:
      context: ../..
      dockerfile: deploy/radar-worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WAHA_BASE_URL: ${WAHA_BASE_URL}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DEFAULT_USER_ID: ${SUPABASE_DEFAULT_USER_ID}
      WHATSAPP_DEDUP_WINDOW_HOURS: ${WHATSAPP_DEDUP_WINDOW_HOURS:-24}
